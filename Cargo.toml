[workspace]
resolver = "3"
exclude = [
    "native/audio_output",
]
members = [
    "native/sg1000_core",
    "native/sms_core",
    "native/media_runtime",
    "native/save_runtime",
    "native/z80_cpu",
    "native/sn76489",
    "native/z80_alu",
    "native/z80_bus",
    "native/audio_runtime",
    "native/ym2413",
    "native/input_runtime",
    "native/temporal_core",
    "native/machine_scheduler",
    "native/video_runtime",
    "native/video_core",
    "native/observability",
    "native/debugger_core",
    "native/sega_desktop",
    "rust/runtime/sms-runtime",
    "rust/runtime/sg1000-runtime",
]
default-members = [
    "native/sg1000_core",
    "native/sms_core",
    "native/media_runtime",
    "native/save_runtime",
    "native/z80_cpu",
    "native/sn76489",
    "native/z80_alu",
    "native/z80_bus",
    "native/audio_runtime",
    "native/ym2413",
    "native/input_runtime",
    "native/temporal_core",
    "native/machine_scheduler",
    "native/video_runtime",
    "native/observability",
    "native/sega_desktop",
    "rust/runtime/sms-runtime",
    "rust/runtime/sg1000-runtime",
]

[workspace.dependencies]
sega-observability = { path = "native/observability" }
sega-debugger-core = { path = "native/debugger_core" }

# PERF-01/S1: candidate LLVM profile; keep the stock release profile as the A/B control.
[profile.release-llvm]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16

# Same optimized code-generation settings with symbols for external CPU profilers.
[profile.release-llvm-debug]
inherits = "release-llvm"
debug = 2
strip = "none"
