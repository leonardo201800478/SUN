name: YM2413 EG stage regression

on:
  pull_request:
    paths:
      - "native/ym2413/**"
      - ".github/workflows/ym2413-eg-stage-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ym2413-eg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Sega Emulator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt && rustup default 1.99.1
      - name: Format YM2413 crate
        run: cargo fmt --manifest-path native/ym2413/Cargo.toml -- --check
      - name: Clippy YM2413 crate and examples
        run: cargo clippy --release --manifest-path native/ym2413/Cargo.toml --all-targets -- -D warnings
      - name: Test YM2413 crate
        run: cargo test --release --manifest-path native/ym2413/Cargo.toml
