name: DP0 Essential Trace A/B Benchmark

on:
  pull_request:
    paths:
      - "native/sms_core/src/temporal_machine.rs"
      - "native/sms_core/examples/dp0_trace_overhead.rs"
      - ".github/workflows/dp0-essential-trace-benchmark.yml"
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Baseline commit SHA (defaults to main)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-ab:
    name: Release A/B — baseline vs essential trace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Resolve current base branch tip
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA_INPUT: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_REF:-}" ]]; then
            git fetch origin "$BASE_REF" --depth=1
            BASE_SHA="$(git rev-parse FETCH_HEAD)"
          elif [[ -n "${BASE_SHA_INPUT:-}" ]]; then
            git fetch --depth=1 origin "$BASE_SHA_INPUT"
            BASE_SHA="$BASE_SHA_INPUT"
          else
            git fetch origin main --depth=1
            BASE_SHA="$(git rev-parse FETCH_HEAD)"
          fi
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Run identical Release workload on baseline and PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/dp0-baseline" "$BASE_SHA"

          mkdir -p "$RUNNER_TEMP/dp0-baseline/native/sms_core/examples"
          cp native/sms_core/examples/dp0_trace_overhead.rs \
            "$RUNNER_TEMP/dp0-baseline/native/sms_core/examples/dp0_trace_overhead.rs"

          export CARGO_TARGET_DIR="$RUNNER_TEMP/dp0-cargo-target"
          export BASE_LOG="$RUNNER_TEMP/dp0-baseline.log"
          export HEAD_LOG="$RUNNER_TEMP/dp0-head.log"

          (
            cd "$RUNNER_TEMP/dp0-baseline"
            cargo run --release --manifest-path native/sms_core/Cargo.toml \
              --example dp0_trace_overhead
          ) | tee "$BASE_LOG"

          (
            cd "$GITHUB_WORKSPACE"
            cargo run --release --manifest-path native/sms_core/Cargo.toml \
              --example dp0_trace_overhead
          ) | tee "$HEAD_LOG"

          python3 - <<'PY'
          import re
          import statistics
          from pathlib import Path

          pattern = re.compile(
              r"DP0_BENCH scenario=(\S+) sample=\d+ frames=\d+ "
              r"instructions=(\d+) ticks=(\d+) elapsed_ns=\d+ "
              r"ns_per_instruction=([0-9.]+)"
          )

          def read_samples(path):
              found = {}
              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  match = pattern.search(line)
                  if match:
                      found.setdefault(match.group(1), []).append(
                          (float(match.group(4)), int(match.group(2)), int(match.group(3)))
                      )
              return found

          import os
          baseline = read_samples(os.environ["BASE_LOG"])
          head = read_samples(os.environ["HEAD_LOG"])
          scenarios = sorted(set(baseline) & set(head))
          if not scenarios:
              raise SystemExit("No matching benchmark samples were produced")

          lines = [
              "## DP0 Release A/B benchmark",
              "",
              f"Baseline commit: `{__import__('os').environ.get('BASE_SHA', 'main')}`",
              f"PR head: `{__import__('os').environ.get('HEAD_SHA', 'unknown')}`",
              "",
              "| Workload | Baseline median (ns/instruction) | PR median (ns/instruction) | Overhead |",
              "|---|---:|---:|---:|",
          ]
          for scenario in scenarios:
              if len(baseline[scenario]) < 3 or len(head[scenario]) < 3:
                  raise SystemExit(f"Insufficient samples for {scenario}")
              baseline_progress = [(item[1], item[2]) for item in baseline[scenario]]
              head_progress = [(item[1], item[2]) for item in head[scenario]]
              if baseline_progress != head_progress:
                  raise SystemExit(f"Instruction count or machine-time divergence in {scenario}")
              base = statistics.median(item[0] for item in baseline[scenario])
              current = statistics.median(item[0] for item in head[scenario])
              overhead = (current / base - 1.0) * 100.0
              lines.append(
                  f"| {scenario} | {base:.3f} | {current:.3f} | {overhead:+.2f}% |"
              )

          lines.extend([
              "",
              "Measurements use the same Release workload and runner for both revisions.",
              "This is a comparative CI measurement, not a substitute for a local Windows hardware benchmark.",
          ])
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(__import__('os').environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          PY
