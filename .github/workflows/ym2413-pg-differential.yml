name: YM2413 Nuked PG differential

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "native/ym2413/**"
      - "tools/ym2413-nuked-oracle/compare_pg.py"
      - "tools/ym2413-nuked-oracle/compare_pg_serial.py"
      - "tools/ym2413-nuked-oracle/compare_operator.py"
      - "tools/ym2413-nuked-oracle/compare_am_lfo.py"
      - "native/ym2413/examples/serial_operator_trace.rs"
      - "native/ym2413/examples/serial_am_lfo_trace.rs"
      - "tools/ym2413-nuked-oracle/trace.c"
      - ".github/workflows/ym2413-pg-differential.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg-differential:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rust implementation
        uses: actions/checkout@v4

      - name: Checkout pinned Nuked-OPLL reference
        env:
          NUKED_SHA: 1269cf5a783b65583b50fa2464d08be75830aaa0
        run: |
          git clone https://github.com/nukeykt/Nuked-OPLL.git "$RUNNER_TEMP/Nuked-OPLL"
          git -C "$RUNNER_TEMP/Nuked-OPLL" checkout "$NUKED_SHA"
          test "$(git -C "$RUNNER_TEMP/Nuked-OPLL" rev-parse HEAD)" = "$NUKED_SHA"

      - name: Instrument pinned Nuked operator boundary
        run: |
          python3 - "$RUNNER_TEMP/Nuked-OPLL/opll.c" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          include = '#include "opll.h"\n'
          if source.count(include) != 1:
              raise SystemExit("pinned Nuked header include anchor changed")
          source = source.replace(
              include,
              include + "\nuint16_t opll_trace_pg_out_before_operator = 0;\n",
              1,
          )
          stage = "    OPLL_PhaseGenerate(chip);\n\n    OPLL_Operator(chip);"
          if source.count(stage) != 1:
              raise SystemExit("pinned Nuked PhaseGenerate/Operator boundary changed")
          source = source.replace(
              stage,
              "    OPLL_PhaseGenerate(chip);\n"
              "    opll_trace_pg_out_before_operator = chip->pg_out;\n\n"
              "    OPLL_Operator(chip);",
              1,
          )
          path.write_text(source, encoding="utf-8")
          PY

      - name: Compile external Nuked trace adapter
        run: |
          cc -std=c11 -O2 -Wall -Wextra -DYM2413_TRACE_OPERATOR_BOUNDARY \
            -I"$RUNNER_TEMP/Nuked-OPLL" \
            tools/ym2413-nuked-oracle/trace.c \
            "$RUNNER_TEMP/Nuked-OPLL/opll.c" \
            -o "$RUNNER_TEMP/ym2413-nuked-trace"

      - name: Generate all-channel serial operator differential sequence
        run: |
          python3 - "$RUNNER_TEMP/operator-events.csv" <<'PY'
          import csv
          import sys

          events = []
          def write_register(address, value, call):
              events.append((call, 0, address))
              events.append((call + 2, 1, value))

          # User patch: AM+VIB, nonzero feedback, both waveform bits,
          # nonzero TL/KSL and distinct AR/DR/SL/RR values.
          patch = (0xE1, 0xA2, 0x55, 0x5D, 0xF3, 0xE4, 0xA5, 0xB6)
          for index, value in enumerate(patch):
              write_register(index, value, index * 40)

          fnums = [32, 64, 128, 192, 256, 320, 384, 448, 511]
          blocks = [min(channel, 7) for channel in range(9)]
          base = 400
          for channel, (fnum, block) in enumerate(zip(fnums, blocks, strict=True)):
              writes = (
                  (0x10 + channel, fnum & 0xFF),
                  (0x20 + channel, 0x10 | ((block & 7) << 1) | ((fnum >> 8) & 1)),
                  (0x30 + channel, 0x00),  # user patch, maximum carrier volume
              )
              for address, value in writes:
                  write_register(address, value, base)
                  base += 40

          # Exercise KEY-OFF and a second KEY-ON on all nine channels.
          for channel, (fnum, block) in enumerate(zip(fnums, blocks, strict=True)):
              write_register(
                  0x20 + channel,
                  ((block & 7) << 1) | ((fnum >> 8) & 1),
                  4000 + channel * 20,
              )
              write_register(
                  0x20 + channel,
                  0x10 | ((block & 7) << 1) | ((fnum >> 8) & 1),
                  5000 + channel * 20,
              )

          # Parameter changes during playback plus each relevant Test Mode bit.
          write_register(0x14, 0x1F, 6000)
          write_register(0x34, 0x0F, 6040)
          write_register(0x0F, 0x01, 7000)
          write_register(0x0F, 0x08, 7200)
          write_register(0x0F, 0x02, 7400)
          write_register(0x0F, 0x04, 7600)
          write_register(0x0F, 0x00, 7800)

          events.sort()
          if any(events[index][0] >= events[index + 1][0] for index in range(len(events) - 1)):
              raise ValueError("operator events must have unique, increasing call indices")
          with open(sys.argv[1], "w", newline="", encoding="utf-8") as stream:
              writer = csv.writer(stream)
              writer.writerow(("# call_index", "port", "value"))
              writer.writerows(events)
          PY
          "$RUNNER_TEMP/ym2413-nuked-trace" --calls 147456 \
            --events "$RUNNER_TEMP/operator-events.csv" \
            > "$RUNNER_TEMP/nuked-operator.jsonl"

      - name: Differentially validate serial operator and feedback state
        run: |
          python3 tools/ym2413-nuked-oracle/compare_operator.py \
            --nuked-trace "$RUNNER_TEMP/nuked-operator.jsonl"

      - name: Differentially validate serial AM LFO shift/carry state
        run: |
          python3 tools/ym2413-nuked-oracle/compare_am_lfo.py \
            --nuked-trace "$RUNNER_TEMP/nuked-operator.jsonl"

      - name: Generate all-channel melodic register sequence
        run: |
          python3 - "$RUNNER_TEMP/events.csv" <<'PY'
          import csv
          import sys

          fnums = [32, 64, 128, 192, 256, 320, 384, 448, 511]
          events = []
          call_index = 0
          for channel, fnum in enumerate(fnums):
              block = min(channel, 7)
              writes = (
                  (0x10 + channel, fnum & 0xFF),
                  (0x20 + channel, ((block & 7) << 1) | ((fnum >> 8) & 1)),
                  (0x30 + channel, 0x10),  # instrument 1, volume 0
              )
              for address, value in writes:
                  events.append((call_index, 0, address))
                  events.append((call_index + 2, 1, value))
                  call_index += 40

          with open(sys.argv[1], "w", newline="", encoding="utf-8") as stream:
              writer = csv.writer(stream)
              writer.writerow(("# call_index", "port", "value"))
              writer.writerows(events)
          PY
          "$RUNNER_TEMP/ym2413-nuked-trace" --calls 147456 --pg-phase-only \
            --events "$RUNNER_TEMP/events.csv" > "$RUNNER_TEMP/nuked-pg-phase.jsonl"

      - name: Compare every captured PG increment with production Rust
        run: |
          python3 tools/ym2413-nuked-oracle/compare_pg.py \
            --nuked-trace "$RUNNER_TEMP/nuked-pg-phase.jsonl"

      - name: Compare all 18 accumulated PG phases with production Rust
        run: |
          python3 tools/ym2413-nuked-oracle/compare_pg_phase.py \
            --nuked-trace "$RUNNER_TEMP/nuked-pg-phase.jsonl"

      - name: Generate serial PG events using the user instrument patch
        run: |
          python3 - "$RUNNER_TEMP/serial-events.csv" <<'PY'
          import csv
          import sys

          fnums = [32, 64, 128, 192, 256, 320, 384, 448, 511]
          events = []
          call_index = 0

          # User patch: modulator MUL=1 + VIB, carrier MUL=2.
          patch = (0x41, 0x02, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00)
          for address, value in enumerate(patch):
              events.append((call_index, 0, address))
              events.append((call_index + 2, 1, value))
              call_index += 40

          for channel, fnum in enumerate(fnums):
              block = min(channel, 7)
              writes = (
                  (0x10 + channel, fnum & 0xFF),
                  (0x20 + channel, ((block & 7) << 1) | ((fnum >> 8) & 1)),
                  (0x30 + channel, 0x00),
              )
              for address, value in writes:
                  events.append((call_index, 0, address))
                  events.append((call_index + 2, 1, value))
                  call_index += 40

          # Exercise serial EG -> DOKON -> delayed PG phase reset on channel 8.
          events.extend(
              (
                  (5000, 0, 0x28),
                  (5002, 1, 0x1F),
                  (5200, 0, 0x28),
                  (5202, 1, 0x0F),
              )
          )

          with open(sys.argv[1], "w", newline="", encoding="utf-8") as stream:
              writer = csv.writer(stream)
              writer.writerow(("# call_index", "port", "value"))
              writer.writerows(events)
          PY
          "$RUNNER_TEMP/ym2413-nuked-trace" --calls 147456 --pg-phase-only --events "$RUNNER_TEMP/serial-events.csv" > "$RUNNER_TEMP/nuked-pg-serial.jsonl"

      - name: Compare integrated core-owned serial PG service with Nuked
        run: |
          python3 tools/ym2413-nuked-oracle/compare_pg_serial.py --nuked-trace "$RUNNER_TEMP/nuked-pg-serial.jsonl" --events "$RUNNER_TEMP/serial-events.csv"

      - name: Generate controlled KEY-ON and KEY-OFF events
        run: |
          python3 - "$RUNNER_TEMP/keyon-events.csv" <<'PY'
          import csv
          import sys

          fnums = [32, 64, 128, 192, 256, 320, 384, 448, 511]
          events = []
          call_index = 0
          for channel, fnum in enumerate(fnums):
              block = min(channel, 7)
              writes = (
                  (0x10 + channel, fnum & 0xFF),
                  (0x20 + channel, ((block & 7) << 1) | ((fnum >> 8) & 1)),
                  (0x30 + channel, 0x10),
              )
              for address, value in writes:
                  events.append((call_index, 0, address))
                  events.append((call_index + 2, 1, value))
                  call_index += 40

          # Assert KEY-ON on channel 8, then clear it after the envelope has advanced.
          events.extend(((1200, 0, 0x28), (1202, 1, 0x1F),
                         (1400, 0, 0x28), (1402, 1, 0x0F)))
          with open(sys.argv[1], "w", newline="", encoding="utf-8") as stream:
              writer = csv.writer(stream)
              writer.writerow(("# call_index", "port", "value"))
              writer.writerows(events)
          PY
          "$RUNNER_TEMP/ym2413-nuked-trace" --calls 2600 --pg-phase-only \
            --events "$RUNNER_TEMP/keyon-events.csv" > "$RUNNER_TEMP/nuked-keyon-phase.jsonl"

      - name: Compare phase accumulator reset after KEY-ON
        run: |
          python3 tools/ym2413-nuked-oracle/compare_pg_phase.py \
            --nuked-trace "$RUNNER_TEMP/nuked-keyon-phase.jsonl" \
            --allow-partial --require-reset-event

      - name: Run pinned MAME/ymfm source-level PG arithmetic audit
        run: |
          python3 tools/ym2413-nuked-oracle/compare_mame_pg.py
