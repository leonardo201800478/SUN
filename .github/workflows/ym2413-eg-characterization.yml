name: YM2413 Nuked EG characterization

on:
  pull_request:
    paths:
      - "tools/ym2413-nuked-oracle/**"
      - ".github/workflows/ym2413-eg-characterization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eg-characterization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sega Emulator
        uses: actions/checkout@v4

      - name: Checkout pinned Nuked-OPLL reference
        env:
          NUKED_SHA: 1269cf5a783b65583b50fa2464d08be75830aaa0
        run: |
          git clone https://github.com/nukeykt/Nuked-OPLL.git "$RUNNER_TEMP/Nuked-OPLL"
          git -C "$RUNNER_TEMP/Nuked-OPLL" checkout "$NUKED_SHA"
          test "$(git -C "$RUNNER_TEMP/Nuked-OPLL" rev-parse HEAD)" = "$NUKED_SHA"

      - name: Compile external oracle adapter
        run: |
          cc -std=c11 -O2 -Wall -Wextra \
            -I"$RUNNER_TEMP/Nuked-OPLL" \
            tools/ym2413-nuked-oracle/trace.c \
            "$RUNNER_TEMP/Nuked-OPLL/opll.c" \
            -o "$RUNNER_TEMP/ym2413-nuked-trace"

      - name: Capture and validate a single-channel EG sequence twice
        run: |
          "$RUNNER_TEMP/ym2413-nuked-trace" --calls 30000 \
            --events tools/ym2413-nuked-oracle/fixtures/eg-single-channel.csv \
            > "$RUNNER_TEMP/eg-trace-a.jsonl"
          "$RUNNER_TEMP/ym2413-nuked-trace" --calls 30000 \
            --events tools/ym2413-nuked-oracle/fixtures/eg-single-channel.csv \
            > "$RUNNER_TEMP/eg-trace-b.jsonl"
          cmp "$RUNNER_TEMP/eg-trace-a.jsonl" "$RUNNER_TEMP/eg-trace-b.jsonl"
      - name: Validate serial EG state and channel events
        run: |
          python3 tools/ym2413-nuked-oracle/validate_eg_trace.py \
            --trace "$RUNNER_TEMP/eg-trace-a.jsonl" --expected-calls 30000

      - name: Extract channel-zero EG update samples
        run: |
          python3 tools/ym2413-nuked-oracle/extract_eg_samples.py \
            --trace "$RUNNER_TEMP/eg-trace-a.jsonl" \
            --output "$RUNNER_TEMP/eg-samples.csv"

      - name: Replay the production Rust EG component
        run: |
          cargo run --quiet --manifest-path native/ym2413/Cargo.toml \
            --example eg_model_trace -- "$RUNNER_TEMP/eg-samples.csv" \
            > "$RUNNER_TEMP/eg-rust-candidates.jsonl"

      - name: Compare explicit Rust reset-state candidates with Nuked
        run: |
          python3 tools/ym2413-nuked-oracle/compare_eg.py \
            --rust-trace "$RUNNER_TEMP/eg-rust-candidates.jsonl"

      - name: Capture four KSR low-bit rows across four channels twice
        run: |
          "$RUNNER_TEMP/ym2413-nuked-trace" --calls 30000 \
            --events tools/ym2413-nuked-oracle/fixtures/eg-rate-lowbits-matrix.csv \
            > "$RUNNER_TEMP/eg-matrix-a.jsonl"
          "$RUNNER_TEMP/ym2413-nuked-trace" --calls 30000 \
            --events tools/ym2413-nuked-oracle/fixtures/eg-rate-lowbits-matrix.csv \
            > "$RUNNER_TEMP/eg-matrix-b.jsonl"
          cmp "$RUNNER_TEMP/eg-matrix-a.jsonl" "$RUNNER_TEMP/eg-matrix-b.jsonl"

      - name: Validate all eight selected operator EG slots
        run: |
          python3 tools/ym2413-nuked-oracle/validate_eg_trace.py \
            --trace "$RUNNER_TEMP/eg-matrix-a.jsonl" \
            --expected-calls 30000 --channels 0,1,2,3

      - name: Extract rate-matrix operator samples and parameters
        run: |
          python3 tools/ym2413-nuked-oracle/extract_eg_samples.py \
            --trace "$RUNNER_TEMP/eg-matrix-a.jsonl" \
            --output "$RUNNER_TEMP/eg-matrix-samples.csv" \
            --channels 0,1,2,3

      - name: Replay the production Rust EG component across the rate matrix
        run: |
          cargo run --quiet --manifest-path native/ym2413/Cargo.toml \
            --example eg_model_trace -- "$RUNNER_TEMP/eg-matrix-samples.csv" \
            > "$RUNNER_TEMP/eg-matrix-rust-candidates.jsonl"

      - name: Compare all four effective-rate low-bit rows with Nuked
        run: |
          python3 tools/ym2413-nuked-oracle/compare_eg.py \
            --rust-trace "$RUNNER_TEMP/eg-matrix-rust-candidates.jsonl"

      - name: Retain deterministic EG and Rust candidate traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ym2413-nuked-eg-characterization
          path: |
            ${{ runner.temp }}/eg-trace-a.jsonl
            ${{ runner.temp }}/eg-samples.csv
            ${{ runner.temp }}/eg-rust-candidates.jsonl
            ${{ runner.temp }}/eg-matrix-a.jsonl
            ${{ runner.temp }}/eg-matrix-samples.csv
            ${{ runner.temp }}/eg-matrix-rust-candidates.jsonl
          if-no-files-found: warn
          retention-days: 7
