name: YM2413 Nuked Rhythm reset differential

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "native/ym2413/Cargo.toml"
      - "native/ym2413/src/lib.rs"
      - "native/ym2413/src/pg_serial.rs"
      - "native/ym2413/src/rhythm.rs"
      - "native/ym2413/src/rhythm_dispatch.rs"
      - "tools/ym2413-nuked-oracle/trace.c"
      - "tools/ym2413-nuked-oracle/compare_rhythm_noise.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rhythm-reset-differential:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rust implementation
        uses: actions/checkout@v4

      - name: Checkout pinned Nuked-OPLL reference
        env:
          NUKED_SHA: 1269cf5a783b65583b50fa2464d08be75830aaa0
        run: |
          git clone https://github.com/nukeykt/Nuked-OPLL.git "$RUNNER_TEMP/Nuked-OPLL"
          git -C "$RUNNER_TEMP/Nuked-OPLL" checkout "$NUKED_SHA"
          test "$(git -C "$RUNNER_TEMP/Nuked-OPLL" rev-parse HEAD)" = "$NUKED_SHA"

      - name: Instrument the actual OPLL_PhaseGenerate decision in the external oracle
        run: |
          perl - "$RUNNER_TEMP/Nuked-OPLL/opll.c" <<'PERL'
          use strict;
          use warnings;

          my $path = shift @ARGV or die "missing opll.c path\n";
          open my $input, '<', $path or die "open $path: $!\n";
          local $/;
          my $source = <$input>;
          close $input;
          $source =~ s/\r\n/\n/g;

          my $include = '#include "opll.h"';
          my $declaration = $include . <<'DECL';

          #ifdef YM2413_TRACE_PHASE_RESET
          extern void ym2413_trace_phase_reset(
              uint32_t cycle, uint8_t rm_enable, uint32_t eg_dokon,
              uint8_t testmode, uint32_t ismod, uint32_t reset_required);
          #endif
          DECL
          my $include_count = () = $source =~ /\Q$include\E/g;
          die "pinned Nuked include anchor changed\n" unless $include_count == 1;
          $source =~ s/\Q$include\E/$declaration/;

          my $old = <<'OLD';
              if ((chip->testmode & 0x04)
               || (ismod && (chip->eg_dokon & 0x8000)) || (!ismod && (chip->eg_dokon & 0x01))) {
                  chip->pg_phase_next = 0;
              } else {
                  chip->pg_phase_next = phase;
              }
          OLD
          my $new = <<'NEW';
              uint32_t phase_reset_required =
                  (chip->testmode & 0x04)
                  || (ismod && (chip->eg_dokon & 0x8000))
                  || (!ismod && (chip->eg_dokon & 0x01));
              if (phase_reset_required) {
                  chip->pg_phase_next = 0;
              } else {
                  chip->pg_phase_next = phase;
              }
              #ifdef YM2413_TRACE_PHASE_RESET
              ym2413_trace_phase_reset(chip->cycles, (uint8_t)chip->rm_enable,
                                       chip->eg_dokon, chip->testmode,
                                       ismod, phase_reset_required);
              #endif
          NEW
          my $branch_count = () = $source =~ /\Q$old\E/g;
          die "pinned OPLL_PhaseGenerate reset branch anchor changed\n"
              unless $branch_count == 1;
          $source =~ s/\Q$old\E/$new/;

          open my $output, '>', $path or die "write $path: $!\n";
          print {$output} $source or die "write $path: $!\n";
          close $output or die "close $path: $!\n";
          PERL

      - name: Compile the external trace adapter and instrumented reference
        run: |
          cc -std=c11 -O2 -Wall -Wextra -DYM2413_TRACE_PHASE_RESET \
            -I"$RUNNER_TEMP/Nuked-OPLL" \
            tools/ym2413-nuked-oracle/trace.c \
            "$RUNNER_TEMP/Nuked-OPLL/opll.c" \
            -o "$RUNNER_TEMP/ym2413-nuked-trace"

      - name: Differentially validate slot-rate DoRhythm LFSR state
        run: |
          "$RUNNER_TEMP/ym2413-nuked-trace" --calls 144 \
            > "$RUNNER_TEMP/nuked-rhythm-noise.jsonl"
          cargo run --quiet --locked \
            --manifest-path native/ym2413/Cargo.toml \
            --example rhythm_noise_trace -- 144 \
            > "$RUNNER_TEMP/rust-rhythm-noise.jsonl"
          python3 tools/ym2413-nuked-oracle/compare_rhythm_noise.py \
            --nuked-trace "$RUNNER_TEMP/nuked-rhythm-noise.jsonl" \
            --rust-trace "$RUNNER_TEMP/rust-rhythm-noise.jsonl" \
            --expected-calls 144

      - name: Capture actual post-shift Rhythm Mode reset decisions
        run: |
          "$RUNNER_TEMP/ym2413-nuked-trace" --calls 144 --phase-reset-probe \
            > /dev/null 2> "$RUNNER_TEMP/rhythm-reset.csv"

      - name: Compare actual Nuked reset decisions with production Rust slot selector
        run: |
          cargo run --quiet --locked \
            --manifest-path native/ym2413/Cargo.toml \
            --example phase_reset_trace -- "$RUNNER_TEMP/rhythm-reset.csv"
